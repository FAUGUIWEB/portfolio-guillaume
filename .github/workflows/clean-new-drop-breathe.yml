name: Clean New Drop Breathing Effect

on:
  push:
    paths:
      - '.github/workflows/clean-new-drop-breathe.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild New Drop effect cleanly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('styles.css')
          css = css_path.read_text(encoding='utf-8')

          start = css.find('.new-drop-title,.section-title{')
          end = css.find('.new-drop-carousel{', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate New Drop CSS region')

          clean = r'''.new-drop-title,.section-title{font-size:clamp(80px,13vw,190px);line-height:.8;letter-spacing:-.01em;margin-bottom:55px;}
.wave-title{position:relative;display:flex;align-items:flex-end;width:fit-content;color:var(--red);-webkit-text-fill-color:var(--red);text-shadow:0 0 10px rgba(255,43,43,.72),0 0 24px rgba(255,43,43,.46),0 0 48px rgba(255,43,43,.18);filter:drop-shadow(0 0 8px rgba(255,43,43,.26));}
.wave-title span{display:inline-block;transform-origin:center 68%;will-change:transform;animation:newDropBreathe 5.8s cubic-bezier(.37,.04,.18,.98) infinite;}
.wave-title span:nth-child(1){animation-delay:0s}.wave-title span:nth-child(2){animation-delay:.16s}.wave-title span:nth-child(3){animation-delay:.32s}.wave-title span:nth-child(4){animation:none}.wave-title span:nth-child(5){animation-delay:.48s}.wave-title span:nth-child(6){animation-delay:.64s}.wave-title span:nth-child(7){animation-delay:.80s}.wave-title span:nth-child(8){animation-delay:.96s}
.wave-title::before,.wave-title::after,.wave-title span::before,.wave-title span::after{content:none!important;display:none!important;}
@keyframes newDropBreathe{0%,16%,100%{transform:scaleX(1) scaleY(1) translateY(0)}34%{transform:scaleX(1.20) scaleY(1.055) translateY(-.012em)}52%,82%{transform:scaleX(1) scaleY(1) translateY(0)}}
'''
          css = css[:start] + clean + css[end:]

          # Keep reduced-motion behavior simple and static.
          css = re.sub(r'@media \(prefers-reduced-motion:reduce\)\{[^{}]*(?:\{[^{}]*\}[^{}]*)*\}\s*$', '', css)
          css += '\n@media (prefers-reduced-motion:reduce){.hero-title-stage,.hero-cassette-layer{transition:none!important;}html{scroll-behavior:auto;}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}.wave-title span{animation:none!important;transform:none!important;}}\n'
          css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          simple = '<h2 class="new-drop-title wave-title" aria-label="New Drop"><span>N</span><span>E</span><span>W</span><span>&nbsp;</span><span>D</span><span>R</span><span>O</span><span>P</span></h2><div class="new-drop-carousel">'
          html, count = re.subn(r'<div class="new-drop-title-wrap">.*?</div><div class="new-drop-carousel">', simple, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not simplify New Drop markup')
          html = re.sub(r'styles\.css\?v=[^"\']+', 'styles.css?v=20260825-13', html)
          index_path.write_text(html, encoding='utf-8')
          PY
      - name: Commit cleaned effect
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clean-new-drop-breathe.yml
          git add styles.css index.html
          git commit -m "Simplify New Drop to red glow breathing letters"
          git push
