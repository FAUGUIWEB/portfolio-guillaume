name: Clean New Drop CSS

on:
  push:
    paths:
      - '.github/workflows/clean-new-drop-css.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate New Drop overrides and install one clean animation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('styles.css')
          css = css_path.read_text(encoding='utf-8')

          # Remove all previously appended New Drop override blocks in one shot.
          markers = [
              '/* NEW DROP — independent 3D letter flips to the right */',
              '/* NEW DROP — readable two-face 3D flip */',
              '/* NEW DROP — readable independent flip, always front-facing */',
              '/* NEW DROP — single DOM text only; no duplicated pseudo-element faces */',
              '/* NEW DROP — clean canonical animation */',
          ]
          positions = [css.find(m) for m in markers if css.find(m) != -1]
          if positions:
              css = css[:min(positions)].rstrip() + '\n\n'

          # Add one single canonical override. No pseudo-elements, no duplicate text.
          canonical = r'''/* NEW DROP — clean canonical animation */
.wave-title{
  animation:none!important;
  color:var(--red);
  filter:none;
  perspective:1000px;
  transform-style:preserve-3d;
}
.wave-title span{
  position:relative;
  display:inline-block;
  color:var(--red);
  transform-origin:center center;
  transform-style:preserve-3d;
  backface-visibility:visible;
  -webkit-backface-visibility:visible;
  will-change:transform,color,text-shadow;
  animation:newDropCleanFlip 6.4s cubic-bezier(.55,.02,.18,.98) infinite!important;
}
.wave-title span::before,
.wave-title span::after{
  content:none!important;
  display:none!important;
}
.wave-title span:nth-child(1){animation-delay:0s!important}
.wave-title span:nth-child(2){animation-delay:.09s!important}
.wave-title span:nth-child(3){animation-delay:.18s!important}
.wave-title span:nth-child(4){animation-delay:.27s!important}
.wave-title span:nth-child(5){animation-delay:.36s!important}
.wave-title span:nth-child(6){animation-delay:.45s!important}
.wave-title span:nth-child(7){animation-delay:.54s!important}
.wave-title span:nth-child(8){animation-delay:.63s!important}
@keyframes newDropCleanFlip{
  0%,26%{
    transform:rotateY(0deg);
    color:var(--red);
    text-shadow:0 0 15px rgba(255,43,43,.58),0 0 34px rgba(255,43,43,.26);
  }
  34%{
    transform:rotateY(-82deg);
    color:var(--red);
    text-shadow:0 0 4px rgba(255,43,43,.16);
  }
  36%{
    transform:rotateY(-89deg);
    color:var(--red);
    text-shadow:none;
  }
  36.01%{
    transform:rotateY(89deg);
    color:#fff;
    text-shadow:none;
  }
  46%,62%{
    transform:rotateY(0deg);
    color:#fff;
    text-shadow:none;
  }
  70%{
    transform:rotateY(-82deg);
    color:#fff;
    text-shadow:none;
  }
  72%{
    transform:rotateY(-89deg);
    color:#fff;
    text-shadow:none;
  }
  72.01%{
    transform:rotateY(89deg);
    color:var(--red);
    text-shadow:0 0 4px rgba(255,43,43,.16);
  }
  82%,100%{
    transform:rotateY(0deg);
    color:var(--red);
    text-shadow:0 0 15px rgba(255,43,43,.58),0 0 34px rgba(255,43,43,.26);
  }
}
.wave-title::after{
  background:var(--red);
  box-shadow:0 0 18px rgba(255,43,43,.38);
  animation:none!important;
}
@media (prefers-reduced-motion:reduce){
  .wave-title span{animation:none!important;transform:none!important;color:var(--red)!important;}
}
'''
          css_path.write_text(css + canonical, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          html = re.sub(r'styles\.css\?v=[^"\']+', 'styles.css?v=20260825-5', html)
          index_path.write_text(html, encoding='utf-8')
          PY
      - name: Commit cleaned CSS
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clean-new-drop-css.yml
          git add styles.css index.html
          git commit -m "Clean New Drop CSS and restore white phase"
          git push
