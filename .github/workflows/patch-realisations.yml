name: Patch réalisations grid

on:
  push:
    paths:
      - '.github/workflows/patch-realisations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch only Réalisations
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          old_grid = '''    .grid {
                width: 100%;
                display: grid;
                grid-template-columns:
                  repeat(2, minmax(0, 1fr));
                gap:
                  72px
                  24px;
              }'''.replace('              ', '')

          new_grid = '''    .grid {
                width: 100%;
                display: grid;
                grid-template-columns:
                  repeat(3, minmax(0, 1fr));
                gap:
                  58px
                  22px;
              }'''.replace('              ', '')

          if old_grid not in text:
              raise SystemExit('Desktop .grid block not found; refusing broad edit.')
          text = text.replace(old_grid, new_grid, 1)

          featured_pattern = re.compile(
              r'''        <article\n          class="project project-featured"\n          onclick="openVideo\('8zoBIHigQSQ'\)"\n        >.*?        </article>''',
              re.S,
          )

          standard_project = '''        <article
                class="project"
                onclick="openVideo('8zoBIHigQSQ')"
              >

                <div class="thumbnail-wrapper">

                  <img
                    class="thumbnail"
                    src="MiniaFeatured.png"
                    alt="ShowReel 2024"
                    loading="lazy"
                  >

                </div>

                <div class="project-info">

                  <div class="project-title">
                    ShowReel 2024
                  </div>

                  <div class="project-tag">
                    Motion Design · Tournage · Montage
                  </div>

                </div>

              </article>'''.replace('              ', '')

          text, count = featured_pattern.subn(standard_project, text, count=1)
          if count != 1:
              raise SystemExit(f'Featured project replacement count={count}; refusing broad edit.')

          if text == original:
              raise SystemExit('No changes made.')

          path.write_text(text, encoding='utf-8')

      - name: Commit targeted change
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify réalisations to 3-column lazy grid"
          git push origin main
