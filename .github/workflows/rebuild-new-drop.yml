name: Rebuild New Drop Effect
on:
  push:
    paths:
      - rebuild_new_drop.py
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 rebuild_new_drop.py
      - run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && git commit -m "Rebuild New Drop animation from scratch" && git push
