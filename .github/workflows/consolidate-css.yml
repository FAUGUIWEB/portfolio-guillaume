name: Consolidate CSS

on:
  push:
    paths:
      - '.github/workflows/consolidate-css.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate styles and fix New Drop flip
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          parts = [root / f'ui-v6-{i}.css' for i in range(1, 6)]
          css = '\n'.join(p.read_text(encoding='utf-8') for p in parts)

          final_css = r'''

          /* NEW DROP — readable two-face 3D flip */
          .wave-title{
            animation:none!important;
            color:transparent!important;
            filter:none!important;
            perspective:1000px;
            transform-style:preserve-3d;
          }
          .wave-title span{
            position:relative;
            display:inline-block;
            color:transparent!important;
            transform-origin:center center;
            transform-style:preserve-3d;
            will-change:transform;
            animation:newDropLetterFlipReadable 6s cubic-bezier(.65,0,.2,1) infinite!important;
          }
          .wave-title span::before,
          .wave-title span::after{
            content:var(--new-drop-letter);
            position:absolute;
            inset:0;
            display:block;
            backface-visibility:hidden;
            -webkit-backface-visibility:hidden;
            pointer-events:none;
          }
          .wave-title span::before{
            color:var(--red);
            transform:rotateY(0deg) translateZ(.2px);
            text-shadow:0 0 15px rgba(255,43,43,.58),0 0 34px rgba(255,43,43,.25);
          }
          .wave-title span::after{
            color:#fff;
            transform:rotateY(180deg) translateZ(.2px);
            text-shadow:none;
          }
          .wave-title span:nth-child(1){--new-drop-letter:"N";animation-delay:0s!important;}
          .wave-title span:nth-child(2){--new-drop-letter:"E";animation-delay:.09s!important;}
          .wave-title span:nth-child(3){--new-drop-letter:"W";animation-delay:.18s!important;}
          .wave-title span:nth-child(4){--new-drop-letter:"\\00a0";animation-delay:.27s!important;}
          .wave-title span:nth-child(5){--new-drop-letter:"D";animation-delay:.36s!important;}
          .wave-title span:nth-child(6){--new-drop-letter:"R";animation-delay:.45s!important;}
          .wave-title span:nth-child(7){--new-drop-letter:"O";animation-delay:.54s!important;}
          .wave-title span:nth-child(8){--new-drop-letter:"P";animation-delay:.63s!important;}
          @keyframes newDropLetterFlipReadable{
            0%,24%{transform:rotateY(0deg);}
            38%,62%{transform:rotateY(-180deg);}
            76%,100%{transform:rotateY(-360deg);}
          }
          .wave-title::after{
            background:var(--red)!important;
            box-shadow:0 0 18px rgba(255,43,43,.38)!important;
            animation:none!important;
          }
          @media (prefers-reduced-motion:reduce){
            .wave-title span{animation:none!important;transform:none!important;}
          }
          '''

          (root / 'styles.css').write_text(css + final_css, encoding='utf-8')

          index = (root / 'index.html').read_text(encoding='utf-8')
          links = ''.join(f'<link rel="stylesheet" href="ui-v6-{i}.css">' for i in range(1, 6))
          replacement = '<link rel="stylesheet" href="styles.css?v=20260825-2">'
          if links not in index:
              raise SystemExit('Expected CSS links were not found in index.html')
          index = index.replace(links, replacement, 1)
          (root / 'index.html').write_text(index, encoding='utf-8')

          for p in parts:
              p.unlink()
          PY

      - name: Commit consolidated CSS
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/consolidate-css.yml
          git add index.html styles.css ui-v6-1.css ui-v6-2.css ui-v6-3.css ui-v6-4.css ui-v6-5.css || true
          git commit -m "Consolidate CSS and fix readable New Drop 3D flip"
          git push
