name: Deploy to OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Optimize New Drop soul animation
        if: ${{ hashFiles('optimize_new_drop_soul.py') != '' }}
        shell: bash
        run: |
          python3 optimize_new_drop_soul.py
          rm -f optimize_new_drop_soul.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize New Drop soul animation performance"
          git push

      - name: Deploy to OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftp.cluster129.hosting.ovh.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /www/
