name: Clean New Drop Animation

on:
  push:
    paths:
      - '.github/workflows/clean-new-drop-animation.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old New Drop overrides and install canonical animation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('styles.css')
          s = p.read_text(encoding='utf-8')

          # Remove every experimental New Drop override appended after the original stylesheet.
          markers = [
              '/* NEW DROP — independent 3D letter flips to the right */',
              '/* NEW DROP — readable two-face 3D flip */',
              '/* NEW DROP — readable independent flip, always front-facing */',
              '/* NEW DROP — single DOM text only; no duplicated pseudo-element faces */',
              '/* NEW DROP — canonical clean animation */'
          ]
          positions = [s.find(m) for m in markers if s.find(m) != -1]
          if positions:
              s = s[:min(positions)].rstrip() + '\n\n'

          canonical = r'''/* NEW DROP — canonical clean animation */
.wave-title{
  animation:none!important;
  color:var(--red)!important;
  filter:none!important;
  perspective:1100px;
  transform-style:preserve-3d;
}
.wave-title span{
  position:relative;
  display:inline-block;
  color:var(--red)!important;
  transform-origin:center center;
  transform-style:preserve-3d;
  backface-visibility:visible!important;
  -webkit-backface-visibility:visible!important;
  will-change:transform,filter,text-shadow;
  animation:newDropCleanFlip 6.4s cubic-bezier(.55,.02,.18,.98) infinite!important;
}
.wave-title span::before,
.wave-title span::after{
  content:none!important;
  display:none!important;
}
.wave-title span:nth-child(1){animation-delay:0s!important}
.wave-title span:nth-child(2){animation-delay:.09s!important}
.wave-title span:nth-child(3){animation-delay:.18s!important}
.wave-title span:nth-child(4){animation-delay:.27s!important}
.wave-title span:nth-child(5){animation-delay:.36s!important}
.wave-title span:nth-child(6){animation-delay:.45s!important}
.wave-title span:nth-child(7){animation-delay:.54s!important}
.wave-title span:nth-child(8){animation-delay:.63s!important}

@keyframes newDropCleanFlip{
  0%,25%{
    transform:rotateY(0deg);
    filter:none;
    text-shadow:0 0 15px rgba(255,43,43,.58),0 0 34px rgba(255,43,43,.26);
  }
  35%{
    transform:rotateY(-89deg);
    filter:none;
    text-shadow:0 0 4px rgba(255,43,43,.16);
  }
  35.01%{
    transform:rotateY(89deg);
    filter:grayscale(1) brightness(8);
    text-shadow:none;
  }
  46%,62%{
    transform:rotateY(0deg);
    filter:grayscale(1) brightness(8);
    text-shadow:none;
  }
  72%{
    transform:rotateY(-89deg);
    filter:grayscale(1) brightness(8);
    text-shadow:none;
  }
  72.01%{
    transform:rotateY(89deg);
    filter:none;
    text-shadow:0 0 4px rgba(255,43,43,.16);
  }
  83%,100%{
    transform:rotateY(0deg);
    filter:none;
    text-shadow:0 0 15px rgba(255,43,43,.58),0 0 34px rgba(255,43,43,.26);
  }
}

.wave-title::after{
  background:var(--red)!important;
  box-shadow:0 0 18px rgba(255,43,43,.38)!important;
  animation:none!important;
}

@media (prefers-reduced-motion:reduce){
  .wave-title span{
    animation:none!important;
    transform:none!important;
    filter:none!important;
  }
}
'''
          p.write_text(s + canonical, encoding='utf-8')

          ip = Path('index.html')
          h = ip.read_text(encoding='utf-8')
          h = re.sub(r'styles\.css\?v=[^"\']+', 'styles.css?v=20260825-7', h)
          ip.write_text(h, encoding='utf-8')
          PY

      - name: Commit cleaned CSS
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clean-new-drop-animation.yml
          git add styles.css index.html
          git commit -m "Clean New Drop CSS and restore white phase"
          git push
